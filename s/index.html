<script>
  // 33张记录表URL，按编号1-33排序
  const baseUrl = "https://1811741412.cdn.123clouddisk.com/1811741412/%E5%B0%B1%E7%88%B1%E7%A7%81%E6%9C%8D%E4%B8%93%E5%B1%9E/%E9%A3%9F%E5%93%81/%E8%AE%B0%E5%BD%95/%E8%AE%B0%E5%BD%95%E8%A1%A8";
  const totalPages = 33;
  let currentPage = 1;

  const pageImage = document.getElementById('pageImage');
  const pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function renderPage() {
    pageImage.src = baseUrl + currentPage + '.jpg';
    pageInfo.textContent = currentPage + ' / ' + totalPages;
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
  }

  function prevPage() {
    if (currentPage > 1) {
      currentPage--;
      renderPage();
    }
  }

  function nextPage() {
    if (currentPage < totalPages) {
      currentPage++;
      renderPage();
    }
  }

  // 键盘左右翻页
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') prevPage();
    if (e.key === 'ArrowRight') nextPage();
  });

  // 初始化
  renderPage();
</script>
